<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gantt Desk 守破離モック</title>
<!--
  PLAN-SHUHARI-UI.md の見た目の到達点を示す静的モックです。アプリ本体ではありません。
  データは固定、今日は 2026-09-21 に固定しています。
  表示の切り替え: ?mode=split|list|gantt  &palette=1  &card=1  &diff=0  &present=1
-->
<style>
:root {
  color-scheme: light;
  /* 地と墨 */
  --paper: #F5F4EF;
  --surface: #FFFFFF;
  --surface-2: #FAF9F6;
  --ink: #1A1E1C;
  --ink-2: #3D4440;
  --muted: #646B66;
  --faint: #A2A8A3;
  --rule: #E4E2DA;
  --rule-2: #EFEEE8;
  --rule-strong: #CFCCC2;
  /* 手の色(セージは守る) */
  --primary: #3E6A5A;
  --primary-2: #33594B;
  --primary-soft: #E2ECE6;
  --primary-ink: #2F5446;
  /* いまの色(朱) */
  --now: #C93C22;
  --now-soft: #FBE7E1;
  --weekend: rgba(26, 30, 28, .028);
  --past: rgba(26, 30, 28, .03);
  --shadow-sm: 0 1px 2px rgba(26, 30, 28, .06);
  --shadow-md: 0 8px 24px rgba(26, 30, 28, .10);
  --shadow-lg: 0 24px 64px rgba(26, 30, 28, .20), 0 2px 8px rgba(26, 30, 28, .06);
  --font-ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", Meiryo, sans-serif;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077 20.4%, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1);
  --header-top: 48px;
  --horizon: 44px;
  --head: 44px;
  --dock-reserve: 84px;
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

/* カテゴリー8色: tint=これから / mid=過ぎた時間 / deep=縁と印 / ink=文字 */
.c-slate   { --tint: #E4E6E4; --mid: #C3C8C5; --deep: #6F7873; --cink: #2E3431; }
.c-indigo  { --tint: #DFE4F3; --mid: #B6C0E2; --deep: #4A5A9C; --cink: #26305E; }
.c-emerald { --tint: #D9EDE2; --mid: #AAD4BE; --deep: #3A8060; --cink: #1E4D37; }
.c-amber   { --tint: #F6EACB; --mid: #EBD08A; --deep: #A0761E; --cink: #5A4210; }
.c-rose    { --tint: #F6DFE2; --mid: #EAB5BD; --deep: #B85466; --cink: #6A2432; }
.c-violet  { --tint: #E8E1F3; --mid: #CBBCE5; --deep: #7B62AE; --cink: #3F2F6B; }
.c-cyan    { --tint: #D8EDF0; --mid: #A6D4DB; --deep: #328094; --cink: #184852; }
.c-orange  { --tint: #F7E3D2; --mid: #EEBE98; --deep: #B26229; --cink: #6B3413; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); }
body { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.ui-icon { width: 16px; height: 16px; flex: 0 0 16px; }

.app-shell { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }

/* ── 守: 題字の帯 ───────────────────────────── */
.app-header { position: relative; z-index: 20; background: var(--surface); }
.topbar { height: var(--header-top); display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--rule-2); }
.app-mark { width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border: 0; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.project-title { font-size: 16px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.project-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.project-meta b { color: var(--ink-2); font-weight: 600; }
.top-spacer { flex: 1; }
.save-pill { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.save-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #3E7B5E; }
.ghost { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.ghost:hover { background: rgba(26, 30, 28, .05); }
.ghost.outline { border-color: var(--rule); }
.ghost.icon { width: 32px; padding: 0; justify-content: center; }
.present-btn { height: 32px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--ink); color: #fff; font-size: 12.5px; font-weight: 600; letter-spacing: .02em; }

/* ── 離: 地平線(時間の窓) ───────────────────── */
.project-ribbon { height: var(--horizon); display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--rule); }
.project-ribbon-track { position: relative; flex: 1; height: 36px; display: grid; grid-template-rows: 13px 19px; row-gap: 3px; }
.time-compass-meta { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; font-size: 10.5px; color: var(--muted); line-height: 1; }
.time-compass-meta .end { justify-self: end; }
.time-compass-annotation { color: var(--ink-2); font-weight: 600; }
.time-compass-rail { position: relative; border-radius: 6px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--rule-2); overflow: hidden; }
.silhouette { position: absolute; inset: 0; width: 100%; height: 100%; }
.rail-past { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(26, 30, 28, .045); }
.rail-now { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--now); }
.rail-pin { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; transform: rotate(45deg); border-radius: 1.5px; background: var(--ink-2); box-shadow: 0 0 0 1.5px var(--surface-2); }
.rail-pin.is-deadline { background: var(--now); }
.rail-lens { position: absolute; top: 1px; bottom: 1px; border: 1.5px solid var(--primary); border-radius: 5px; background: color-mix(in srgb, var(--primary) 6%, transparent); }
.rail-span { position: absolute; bottom: 0; height: 3px; border-radius: 2px; background: var(--primary); }
.density { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 600; }
.density input { width: 72px; accent-color: var(--primary); }

/* ── 画面を使い切る作業面 ───────────────────── */
.workspace { min-height: 0; display: flex; overflow: hidden; background: var(--surface); --row-height: 30px; --bar-h: 22px; }
.task-panel { flex: 0 0 280px; min-width: 0; display: grid; grid-template-rows: var(--head) 1fr; border-right: 1px solid var(--rule); background: var(--surface); position: relative; z-index: 2; }
.task-head { display: flex; align-items: flex-end; gap: 8px; padding: 0 12px 8px 14px; border-bottom: 1px solid var(--rule); background: var(--surface-2); color: var(--muted); font-size: 11.5px; font-weight: 600; }
.task-head b { color: var(--ink); font-size: 12px; }
.task-scroll { overflow: hidden; }
.task-rows { padding-bottom: var(--dock-reserve); }

/* 破: 表ではなく、索引 */
.task-row { position: relative; height: var(--row-height); display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 20px; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--rule-2); }
.task-row::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px; border-radius: 0 3px 3px 0; background: var(--deep); }
.task-row:hover { background: rgba(26, 30, 28, .025); }
.task-row.is-selected { background: color-mix(in srgb, var(--primary) 9%, transparent); }
.check { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--faint); display: grid; place-items: center; }
.is-done .check { border-color: var(--primary); background: var(--primary); }
.is-done .check::after { content: ""; width: 7px; height: 4px; margin-top: -2px; border: 1.7px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg); }
.row-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 500; }
.is-done .row-name { color: var(--muted); font-weight: 400; }
.row-state { font-size: 11px; font-weight: 700; white-space: nowrap; }
.row-state.late { color: var(--now); }
.row-state.active { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent); }
.row-more { width: 20px; height: 20px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); opacity: 0; font-size: 11px; letter-spacing: -1px; }
.task-row:hover .row-more, .task-row.is-selected .row-more { opacity: 1; }

.timeline-panel { min-width: 0; flex: 1; display: flex; }
.timeline-scroll { position: relative; flex: 1; min-width: 0; overflow: hidden; }
.timeline-inner { position: relative; }

/* 守: 二段の日付見出し */
.timeline-head { position: sticky; top: 0; z-index: 8; height: var(--head); border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--surface-2) 92%, transparent); backdrop-filter: blur(8px); }
.month-label { position: absolute; top: 6px; padding-left: 6px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.month-label small { margin-left: 4px; color: var(--muted); font-size: 10.5px; font-weight: 600; }
.month-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--rule-strong); }
.day-tick { position: absolute; bottom: 5px; transform: translateX(-50%); font-size: 10.5px; color: var(--muted); }
.day-tick.is-today { color: var(--now); font-weight: 700; }

.timeline-body { position: relative; padding-bottom: var(--dock-reserve); }
/* 破: 日の格子を消し、週末の帯と週・月の罫だけにする */
.grid-bands { position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, transparent calc(var(--dw) * 2), var(--rule-2) 0 calc(var(--dw) * 2 + 1px), transparent 0) var(--we-offset) 0 / calc(var(--dw) * 7) 100% repeat-x,
    linear-gradient(90deg, var(--weekend) 0 calc(var(--dw) * 2), transparent 0) var(--we-offset) 0 / calc(var(--dw) * 7) 100% repeat-x; }
.month-rule { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--rule); pointer-events: none; }
.past-wash { position: absolute; top: 0; bottom: 0; left: 0; background: var(--past); pointer-events: none; }

/* 離: いまの刃 */
.now-blade { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--now); box-shadow: 0 0 0 4px color-mix(in srgb, var(--now) 9%, transparent); z-index: 6; pointer-events: none; transform-origin: top; animation: blade .55s var(--ease-out) both; }
.now-flag { position: absolute; top: 3px; z-index: 9; display: flex; align-items: center; transform: translateX(-50%); white-space: nowrap; border-radius: 999px; box-shadow: 0 2px 8px color-mix(in srgb, var(--now) 30%, transparent); }
.now-flag .pill { height: 20px; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 999px; background: var(--now); color: #fff; font-size: 11px; font-weight: 700; }
.now-flag .late { height: 20px; margin-left: -10px; padding: 0 9px 0 16px; border: 1.5px solid var(--now); border-radius: 0 999px 999px 0; background: var(--surface); color: var(--now); font-size: 11px; font-weight: 700; }

/* 破: 締切は柱になる */
.deadline-pillar { position: absolute; top: 0; bottom: 0; border-left: 1.5px dashed color-mix(in srgb, var(--now) 55%, transparent); z-index: 5; pointer-events: none; }
.deadline-flag { position: absolute; top: 3px; z-index: 9; padding: 2px 8px 2px 7px; border: 1.5px solid color-mix(in srgb, var(--now) 45%, transparent); border-radius: 999px; background: var(--surface); color: var(--now); font-size: 11px; font-weight: 700; white-space: nowrap; transform: translateX(-50%); }
.deadline-flag span { color: var(--ink-2); font-weight: 600; }

.timeline-row { position: relative; height: var(--row-height); border-bottom: 1px solid var(--rule-2); }
.timeline-row:hover { background: rgba(26, 30, 28, .022); }
.timeline-row.is-selected { background: color-mix(in srgb, var(--primary) 7%, transparent); }

/* 守: バーは色と位置。離: 過ぎた時間だけ濃くなる */
.task-bar { position: absolute; top: 50%; height: var(--bar-h); display: flex; align-items: center; gap: 8px; padding: 0 9px 0 11px; border: 0; border-radius: 7px; transform: translateY(-50%);
  background: linear-gradient(90deg, var(--mid) var(--elapsed, 0%), var(--tint) var(--elapsed, 0%));
  box-shadow: inset 3px 0 0 var(--deep), 0 1px 1px rgba(26, 30, 28, .05);
  color: var(--cink); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; z-index: 3;
  transition: transform .16s var(--ease-out), box-shadow .16s var(--ease-out); }
.task-bar:hover { transform: translateY(calc(-50% - 1px)); box-shadow: inset 3px 0 0 var(--deep), 0 8px 18px rgba(26, 30, 28, .14); }
.task-bar .dates { font-weight: 500; font-size: 11px; opacity: .7; }
.task-bar.is-done { background: #E8E7E2; box-shadow: inset 3px 0 0 #B9BDB9; color: #5F6662; }
.task-bar.is-done::before { content: "✓"; font-weight: 700; margin-right: -3px; }
.task-bar.is-selected { outline: 2px solid var(--primary); outline-offset: 2px; }
.name-out { position: absolute; top: 50%; transform: translateY(-50%); display: flex; gap: 7px; align-items: baseline; font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; pointer-events: none; z-index: 3; }
.name-out .dates { color: var(--muted); font-size: 11px; font-weight: 500; }
.is-done-row .name-out { color: var(--muted); }

.milestone { position: absolute; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; transform: rotate(45deg); border-radius: 3px; background: var(--deep); box-shadow: 0 0 0 2px var(--surface), 0 1px 3px rgba(26, 30, 28, .22); z-index: 4; }
.milestone.is-done { background: var(--faint); }
.milestone.is-deadline { background: var(--now); }
.milestone.is-late { background: var(--surface); box-shadow: 0 0 0 2px var(--now); }

/* 離: 遅れは、いまへ伸びる朱の糸 */
.late-thread { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: repeating-linear-gradient(90deg, var(--now) 0 6px, transparent 6px 9px); transform-origin: left; animation: thread .5s .3s var(--ease-out) both; z-index: 2; }
.late-thread::after { content: ""; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); box-shadow: 0 0 0 2px var(--surface); }
.late-label { position: absolute; top: 50%; transform: translateY(-50%); color: var(--now); font-size: 11px; font-weight: 700; white-space: nowrap; z-index: 7; animation: fade .3s .6s both; }

/* 離: 変化は残像で語る(前の姿を点線でバーの上に重ねる) */
.afterimage { position: absolute; top: 50%; height: calc(var(--bar-h) + 4px); transform: translateY(-50%); border: 1.5px dashed var(--ink-2); border-radius: 8px; background: repeating-linear-gradient(135deg, rgba(26, 30, 28, .07) 0 3px, transparent 3px 7px); z-index: 4; pointer-events: none; animation: ghost .5s var(--ease-out) both; }
.delta-chip { position: absolute; top: 50%; transform: translateY(-50%); padding: 2px 7px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 10.5px; font-weight: 700; white-space: nowrap; z-index: 4; animation: pop .45s .2s var(--ease-spring) both; }
.task-bar.is-new { box-shadow: inset 3px 0 0 var(--deep), 0 0 0 2px var(--surface), 0 0 0 4px color-mix(in srgb, var(--primary) 60%, transparent); }
.new-badge { position: absolute; top: 50%; transform: translateY(-50%); padding: 2px 6px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 10px; font-weight: 700; z-index: 4; }

@keyframes blade { from { transform: scaleY(0); } }
@keyframes thread { from { transform: scaleX(0); } }
@keyframes fade { from { opacity: 0; } }
@keyframes ghost { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(-50%) scale(.6); } }

/* ── 破: 操作は下に浮かぶ ───────────────────── */
.toolbar { position: fixed; left: 50%; bottom: 18px; z-index: 40; display: flex; align-items: center; gap: 4px; padding: 6px; transform: translateX(-50%);
  border: 1px solid rgba(26, 30, 28, .08); border-radius: 16px;
  background: color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: 0 16px 40px rgba(26, 30, 28, .16), 0 2px 6px rgba(26, 30, 28, .06); animation: rise .5s .15s var(--ease-spring) both; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 16px); } }
.dock-btn { height: 38px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 0; border-radius: 11px; background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.dock-btn:hover { background: rgba(26, 30, 28, .06); }
.dock-btn.primary { background: var(--primary); color: #fff; padding: 0 14px 0 11px; }
.dock-btn.primary:hover { background: var(--primary-2); }
.dock-btn.icon { width: 38px; padding: 0; justify-content: center; }
.dock-sep { width: 1px; height: 22px; margin: 0 4px; background: var(--rule); }
.search-box { height: 38px; width: 250px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 11px; border-radius: 11px; background: rgba(26, 30, 28, .045); color: var(--muted); font-size: 13px; }
.search-box span { flex: 1; }
kbd { padding: 2px 6px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); color: var(--muted); font: 600 10.5px/1.2 var(--font-ui); }
.segmented { display: inline-flex; padding: 3px; border-radius: 11px; background: rgba(26, 30, 28, .05); }
.segmented button { height: 32px; padding: 0 11px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.segmented button.is-active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.zoom { display: inline-flex; }
.zoom .dock-btn { width: 32px; padding: 0; justify-content: center; font-size: 16px; }

/* 条件と変化は、道具の上に浮かぶ */
.condition-bar { position: fixed; left: 50%; bottom: 82px; z-index: 39; display: flex; gap: 6px; transform: translateX(-50%); animation: rise .5s .35s var(--ease-spring) both; }
.diff-chip { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 6px 0 14px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; box-shadow: var(--shadow-md); white-space: nowrap; }
.diff-chip b { font-weight: 700; }
.diff-chip .n { color: rgba(255, 255, 255, .72); }
.diff-chip .n strong { color: #fff; }
.diff-chip button { height: 24px; padding: 0 10px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .14); color: #fff; font-size: 11.5px; font-weight: 600; }
.diff-chip .x { width: 24px; padding: 0; }

/* ── 離: どこからでも呼べる手帳(Ctrl K) ───────── */
.palette-layer { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(26, 30, 28, .18); backdrop-filter: blur(2px); }
.palette-layer.is-open { display: block; }
.palette { position: absolute; left: 50%; top: 13vh; width: min(640px, calc(100vw - 24px)); transform: translateX(-50%); border: 1px solid var(--rule); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-lg); overflow: hidden; animation: drop .28s var(--ease-spring) both; }
@keyframes drop { from { opacity: 0; transform: translate(-50%, -8px) scale(.98); } }
.palette-input { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--rule-2); font-size: 17px; }
.palette-input .typed { flex: 1; }
.palette-input .caret { display: inline-block; width: 2px; height: 20px; margin-left: 1px; background: var(--primary); vertical-align: -4px; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.pal-group { padding: 8px; }
.pal-group + .pal-group { border-top: 1px solid var(--rule-2); }
.pal-group h4 { margin: 4px 10px 6px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
.pal-item { width: 100%; display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 10px; background: transparent; text-align: left; font-size: 13.5px; }
.pal-item.is-active { background: var(--primary-soft); }
.pal-item small { color: var(--muted); font-size: 12px; }
.pal-item mark { background: none; color: var(--primary-ink); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--primary) 40%, transparent); }
.pal-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--deep); justify-self: center; }
.pal-diamond { width: 9px; height: 9px; transform: rotate(45deg); border-radius: 2px; background: var(--now); justify-self: center; }
.pal-icon { color: var(--muted); justify-self: center; }
.pal-foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--rule-2); background: var(--surface-2); color: var(--muted); font-size: 11.5px; }

/* 予定カード(既存の部品を新しい型で) */
.task-card { position: fixed; z-index: 50; width: 340px; display: none; gap: 10px; padding: 14px; border: 1px solid var(--rule); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-lg); animation: card .3s var(--ease-spring) both; transform-origin: top left; }
.task-card.is-open { display: grid; }
@keyframes card { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head .pal-dot { width: 10px; height: 10px; }
.card-name { flex: 1; font-size: 15px; font-weight: 700; }
.card-dates { display: flex; align-items: center; gap: 8px; }
.date-pill { padding: 6px 10px; border: 1px solid var(--rule); border-radius: 10px; font-size: 13px; font-weight: 600; }
.card-days { color: var(--muted); font-size: 12px; }
.card-status { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; background: var(--surface-2); font-size: 12px; color: var(--ink-2); }
.card-meter { flex: 1; height: 6px; border-radius: 3px; background: var(--tint); overflow: hidden; }
.card-meter i { display: block; height: 100%; background: var(--deep); }
.card-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); }
.card-row .val { color: var(--ink); font-weight: 600; }
.card-foot { display: flex; align-items: center; gap: 14px; padding-top: 10px; border-top: 1px solid var(--rule-2); font-size: 12.5px; font-weight: 600; }
.card-foot .danger { color: var(--now); }
.card-foot .link { color: var(--primary); }
.card-foot .nav { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--muted); }
.card-foot .nav button { width: 28px; height: 28px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }

/* ── 一覧(全幅の表と、行の中の小さなガント) ────── */
.list-table { flex: 1; overflow: hidden; }
.list-head, .list-row { display: grid; grid-template-columns: 44px minmax(220px, 1.4fr) 120px minmax(180px, 1.2fr) 88px 88px 64px 96px 40px; align-items: center; }
.list-head { height: var(--head); padding: 0 12px; border-bottom: 1px solid var(--rule); background: var(--surface-2); color: var(--muted); font-size: 11.5px; font-weight: 600; }
.list-row { position: relative; height: 40px; padding: 0 12px; border-bottom: 1px solid var(--rule-2); font-size: 13px; }
.list-row::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--deep); }
.list-row .check { margin-left: 8px; }
.list-row .row-name { font-size: 13px; }
.cat-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.cat-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--deep); }
.mini-span { position: relative; height: 6px; margin-right: 18px; border-radius: 3px; background: var(--rule-2); }
.mini-span i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--deep); }
.mini-span b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--now); }
.mini-span.is-done i { background: var(--faint); }
.state-pill { justify-self: start; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.state-pill.late { background: var(--now-soft); color: var(--now); }
.state-pill.active { background: var(--primary-soft); color: var(--primary-ink); }
.state-pill.upcoming { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule); }
.state-pill.done { color: var(--faint); }

/* ── Present: 題字と凡例だけが残る ─────────────── */
.present-bar { display: none; }
body.is-present .topbar, body.is-present .project-ribbon, body.is-present .toolbar, body.is-present .condition-bar { display: none; }
body.is-present .present-bar { height: 38px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--rule); background: var(--surface); }
.present-bar strong { font-size: 15px; font-weight: 700; }
.present-bar .meta { color: var(--muted); font-size: 12px; }
.legend { display: flex; gap: 12px; margin-left: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.legend i { width: 8px; height: 8px; border-radius: 2px; background: var(--deep); }
.present-bar .sp { flex: 1; }
body.is-present .row-more, body.is-present .check { display: none; }
body.is-present .task-row { grid-template-columns: minmax(0, 1fr) auto; }

/* ── スマホ ─────────────────────────────── */
.mobile-only { display: none; }
@media (max-width: 767px) {
  :root { --dock-reserve: 96px; }
  .desk-only { display: none !important; }
  .mobile-only { display: revert; }
  .topbar { gap: 8px; padding: 0 10px; }
  .project-title { font-size: 15px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .project-meta { display: none; }
  .project-ribbon { padding: 0 10px; }
  .task-panel { flex-basis: 104px; }
  .workspace.mode-gantt .task-row { grid-template-columns: minmax(0, 1fr); padding: 0 6px 0 10px; }
  .workspace.mode-gantt .task-row .check, .workspace.mode-gantt .task-row .row-state, .workspace.mode-gantt .task-row .row-more { display: none; }
  .workspace.mode-gantt .row-name { font-size: 12px; }
  /* スマホのガント: 名前は左の列だけ。バーの横には出さない */
  .workspace.mode-gantt .name-out, .workspace.mode-gantt .deadline-flag, .workspace.mode-gantt .month-label small { display: none; }
  .workspace.mode-gantt .task-bar > span { display: none; }
  .toolbar { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); transform: none; gap: 4px; padding: 6px; border-radius: 18px; animation-name: rise-m; }
  @keyframes rise-m { from { opacity: 0; transform: translateY(16px); } }
  .dock-btn { height: 46px; border-radius: 13px; font-size: 13.5px; }
  .dock-btn.primary { flex: 1; justify-content: center; }
  .dock-btn.icon { width: 46px; }
  .condition-bar { bottom: calc(76px + env(safe-area-inset-bottom)); left: 10px; right: 10px; transform: none; justify-content: center; }
  .diff-chip { gap: 8px; padding-left: 12px; font-size: 11.5px; }
  /* スマホの一覧: 1行が1枚の札。札の中に小さなガント */
  .ticket { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 8px; row-gap: 5px; padding: 11px 14px 12px 16px; border-bottom: 1px solid var(--rule-2); }
  .ticket::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--deep); }
  .ticket .check { width: 20px; height: 20px; margin-top: 1px; grid-row: 1 / span 3; }
  .ticket .t-name { font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticket.is-done .t-name { color: var(--muted); font-weight: 500; }
  .ticket .t-meta { grid-column: 2 / span 2; color: var(--muted); font-size: 12px; }
  .ticket .mini-span { grid-column: 2 / span 2; margin: 3px 0 0; height: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="topbar">
      <button class="app-mark" type="button" aria-label="プロジェクト設定">G</button>
      <span class="project-title">秋の新商品ローンチ</span>

      <button class="ghost icon desk-only" type="button" aria-label="元に戻す"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 3 7l3 3"/><path d="M3 7h6.5a3.5 3.5 0 0 1 0 7H8"/></svg></button>
      <button class="ghost icon desk-only" type="button" aria-label="やり直す"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m10 4 3 3-3 3"/><path d="M13 7H6.5a3.5 3.5 0 0 0 0 7H8"/></svg></button>
      <button class="ghost outline desk-only" type="button">AI用JSON</button>
      <button class="ghost outline" type="button">JSON <svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m4 6 4 4 4-4"/></svg></button>
      <button class="present-btn" type="button" id="present-btn">Present</button>
    </div>
    <section id="project-ribbon" class="project-ribbon" aria-label="プロジェクト全体">
      <div class="project-ribbon-track">
        <div class="time-compass-meta num"><span id="h-start"></span><span class="time-compass-annotation" id="h-note"></span><span class="end" id="h-end"></span></div>
        <div class="time-compass-rail" id="rail"></div>
      </div>
      <label class="density desk-only">行 <input type="range" min="14" max="56" value="30"> <span class="num" id="row-out">30</span></label>

      <strong>秋の新商品ローンチ</strong><span class="meta num" id="present-meta"></span>

      <span class="sp"></span>
      <button class="ghost outline" type="button">書き出し</button><button class="present-btn" type="button" id="exit-present">編集に戻る</button>
    </div>
  </header>
  <main id="workspace" class="workspace mode-split"></main>
</div>

<div id="condition-bar" class="condition-bar"></div>

<nav class="toolbar" aria-label="操作">
  <button class="dock-btn primary add-button" type="button"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg><span>予定を追加</span></button>
  <label class="search-box desk-only"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg><span>予定を絞り込む</span><kbd id="search-open" title="予定・操作を探す" style="cursor:pointer">Ctrl K</kbd></label>
  <button class="dock-btn icon mobile-only" type="button" aria-label="予定・操作を探す" id="search-open-m"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg></button>
  <button class="dock-btn" type="button">絞り込み</button>
  <span class="dock-sep desk-only"></span>
  <button class="dock-btn desk-only" type="button">今日</button>
  <button class="dock-btn desk-only" type="button">全体</button>
  <span class="zoom desk-only"><button class="dock-btn" type="button" aria-label="縮小">−</button><button class="dock-btn" type="button" aria-label="拡大">＋</button></span>
  <span class="dock-sep desk-only"></span>
  <div class="segmented desk-only" id="mode-switch"><button type="button" data-mode="list">一覧</button><button type="button" data-mode="split">分割</button><button type="button" data-mode="gantt">ガント</button></div>
  <button class="dock-btn mobile-only" type="button" id="mobile-toggle">ガント</button>
  <button class="dock-btn icon" type="button" aria-label="その他">•••</button>
</nav>

<div class="palette-layer" id="palette"><div class="palette" role="dialog" aria-label="予定・操作を探す">
  <div class="palette-input"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg><span class="typed">発表<span class="caret"></span></span><kbd>Esc</kbd></div>
  <div class="pal-group"><h4>予定</h4>
    <button class="pal-item is-active c-cyan" type="button"><i class="pal-diamond"></i><span><mark>発表</mark>会</span><small class="num">11/12 · 締切 · あと52日</small></button>
    <button class="pal-item c-cyan" type="button"><i class="pal-dot"></i><span><mark>発表</mark>会の会場手配</span><small class="num">9/28–10/9 · 運営</small></button>
    <button class="pal-item c-rose" type="button"><i class="pal-dot"></i><span>プレスリリース作成</span><small class="num">10/1–10/14 · 広報 · メモに「<mark>発表</mark>」</small></button>
  </div>
  <div class="pal-group"><h4>操作</h4>
    <button class="pal-item" type="button"><span class="pal-icon">⌕</span><span>「<mark>発表</mark>」で絞り込む</span><small>Enter + Shift</small></button>
    <button class="pal-item" type="button"><span class="pal-icon">◷</span><span>今日へ移動</span><kbd>T</kbd></button>
    <button class="pal-item" type="button"><span class="pal-icon">⤢</span><span>全体を表示</span><kbd>F</kbd></button>
  </div>
  <div class="pal-foot"><span>↑↓ 選ぶ</span><span>Enter 開く</span><span>Esc 閉じる</span><span style="margin-left:auto">予定 3 · 操作 3</span></div>
</div></div>

<div class="task-card c-amber" id="card">
  <div class="card-head"><i class="pal-dot"></i><span class="card-name">EC連携の実装</span><button class="ghost icon" type="button" aria-label="閉じる">✕</button></div>
  <div class="card-dates num"><span class="date-pill">9/21 月</span><span style="color:var(--faint)">→</span><span class="date-pill">10/16 金</span><span class="card-days">26日間</span></div>
  <div class="card-status num"><span>今日で1日目</span><span class="card-meter"><i style="width:4%"></i></span><span>残り25日</span></div>
  <div class="card-row">カテゴリー <span class="val">開発</span><span style="margin-left:auto">完了</span><span class="check"></span></div>
  <div class="card-row" style="color:var(--faint)">メモ</div>
  <div class="card-foot"><span class="danger">削除</span><span class="link">すべての項目</span><span class="nav num"><button type="button">‹</button>9/26<button type="button">›</button></span></div>
</div>

<script>
const TODAY = '2026-09-21';
const params = new URLSearchParams(location.search);
const CATS = { 企画: 'indigo', デザイン: 'emerald', 開発: 'amber', 広報: 'rose', 営業: 'violet', 運営: 'cyan' };
const T = (name, start, end, cat, extra = {}) => ({ name, start, end: end || start, cat, milestone: !end, ...extra });
const tasks = [
  T('市場調査のまとめ', '2026-09-01', '2026-09-08', '企画', { done: true }),
  T('コンセプト決定', '2026-09-07', '2026-09-12', '企画', { done: true }),
  T('企画承認', '2026-09-14', null, '企画', { done: true }),
  T('会場の仮押さえ', '2026-09-09', '2026-09-17', '運営'),
  T('ロゴ・KV制作', '2026-09-10', '2026-09-26', 'デザイン'),
  T('パッケージデザイン', '2026-09-18', '2026-10-09', 'デザイン'),
  T('LPデザイン', '2026-09-24', '2026-10-10', 'デザイン'),
  T('要件定義', '2026-09-08', '2026-09-19', '開発'),
  T('EC連携の実装', '2026-09-21', '2026-10-16', '開発'),
  T('LP実装', '2026-10-05', '2026-10-27', '開発', { was: ['2026-10-05', '2026-10-23'] }),
  T('β版リリース', '2026-10-19', null, '開発'),
  T('負荷試験', '2026-10-23', '2026-11-02', '開発', { was: ['2026-10-20', '2026-10-30'] }),
  T('プレスリリース作成', '2026-10-01', '2026-10-14', '広報'),
  T('メディアリスト整備', '2026-09-22', '2026-10-02', '広報'),
  T('インフルエンサー依頼', '2026-10-04', '2026-10-24', '広報', { was: ['2026-10-06', '2026-10-24'] }),
  T('SNS告知開始', '2026-10-26', null, '広報'),
  T('受注目標の設定', '2026-09-15', '2026-09-22', '営業', { done: true }),
  T('販売店への説明会', '2026-10-13', '2026-10-15', '営業'),
  T('店頭什器の手配', '2026-10-12', '2026-11-04', '営業'),
  T('店頭POP制作', '2026-10-15', '2026-10-28', '営業', { isNew: true }),
  T('発表会の会場手配', '2026-09-28', '2026-10-09', '運営'),
  T('当日運営マニュアル', '2026-10-19', '2026-11-06', '運営'),
  T('リハーサル', '2026-11-09', '2026-11-10', '運営'),
  T('発表会', '2026-11-12', null, '運営', { deadline: true }),
  T('発売', '2026-11-20', null, '営業'),
  T('振り返り', '2026-11-24', '2026-11-27', '企画'),
];
const showDiff = params.get('diff') !== '0';

const DAY = 86400000;
const toDate = (iso) => new Date(`${iso}T00:00:00Z`);
const diff = (a, b) => Math.round((toDate(b) - toDate(a)) / DAY);
const add = (iso, n) => new Date(toDate(iso).getTime() + n * DAY).toISOString().slice(0, 10);
const md = (iso) => { const d = toDate(iso); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function stateOf(t) {
  if (t.done) return 'done';
  if (t.end < TODAY) return 'late';
  if (t.start <= TODAY) return 'active';
  return 'upcoming';
}
const cls = (t) => `c-${CATS[t.cat]}`;
const range = { start: add(tasks.map((t) => t.start).sort()[0], -2), end: add(tasks.map((t) => t.end).sort().at(-1), 2) };
const days = diff(range.start, range.end) + 1;
const projStart = tasks.map((t) => t.start).sort()[0];
const projEnd = tasks.map((t) => t.end).sort().at(-1);
const projDays = diff(projStart, projEnd) + 1;
const nextDeadline = tasks.filter((t) => t.deadline && !t.done && t.start >= TODAY).sort((a, b) => a.start.localeCompare(b.start))[0];

// ponytail: 12px の概算。全角1.0 / 半角0.6。実測しない(本体の nameWidth と同じ考え方)
const textW = (s, px = 12) => [...s].reduce((w, ch) => w + (ch.charCodeAt(0) > 255 ? 1 : 0.6), 0) * px;

function counts() {
  const states = tasks.map(stateOf);
  return { active: states.filter((s) => s === 'active').length, late: states.filter((s) => s === 'late').length };
}

function header() {
  document.querySelector('#meta').innerHTML = `<b>${md(projStart)} – ${md(projEnd)}</b> · ${tasks.length}件${nextDeadline ? ` · 締切「${nextDeadline.name}」まで <b>${diff(TODAY, nextDeadline.start)}日</b>` : ''}`;
  document.querySelector('#present-meta').textContent = `${md(projStart)}–${md(projEnd)} · ${tasks.length}件 · 今日 ${md(TODAY)}`;
  document.querySelector('#legend').innerHTML = Object.entries(CATS).map(([name, c]) => `<span class="c-${c}"><i></i>${name}</span>`).join('');
  document.querySelector('#h-start').textContent = md(projStart);
  document.querySelector('#h-end').textContent = md(projEnd);
  // 地平線: 同時に進む予定の数を山並みにする(既存の bucketActivity と同じ48区間)
  const N = 48;
  const load = new Array(N).fill(0);
  tasks.forEach((t) => {
    const a = Math.floor(diff(projStart, t.start) / projDays * N);
    const b = Math.floor(diff(projStart, t.end) / projDays * N);
    for (let i = clamp(a, 0, N - 1); i <= clamp(b, 0, N - 1); i += 1) load[i] += 1;
  });
  const max = Math.max(...load);
  let peakFrom = load.indexOf(max);
  let peakTo = peakFrom;
  while (peakFrom > 0 && load[peakFrom - 1] >= max * 0.68) peakFrom -= 1;
  while (peakTo + 1 < N && load[peakTo + 1] >= max * 0.68) peakTo += 1;
  const at = (i) => add(projStart, Math.round(i / N * projDays));
  document.querySelector('#h-note').textContent = `集中 ${md(at(peakFrom))}–${md(at(peakTo + 1))} · 最大${max}件`;
  const path = load.map((v, i) => `L${(i / (N - 1) * 100).toFixed(2)},${(20 - v / max * 17).toFixed(2)}`).join(' ');
  const ratio = (iso) => clamp(diff(projStart, iso) / (projDays - 1), 0, 1) * 100;
  const pins = tasks.filter((t) => t.milestone).map((t) => `<i class="rail-pin ${t.deadline ? 'is-deadline' : ''}" style="left:${ratio(t.start)}%" title="${esc(t.name)}"></i>`).join('');
  document.querySelector('#rail').innerHTML = `<svg class="silhouette" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="sil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E6A5A" stop-opacity=".42"/><stop offset="1" stop-color="#3E6A5A" stop-opacity=".08"/></linearGradient></defs>
      <path d="M0,20 ${path} L100,20 Z" fill="url(#sil)"/><path d="${path.replace('L', 'M')}" fill="none" stroke="#3E6A5A" stroke-opacity=".7" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>
    <div class="rail-past" style="width:${ratio(TODAY)}%"></div>${pins}<i class="rail-now" style="left:${ratio(TODAY)}%"></i>
    ${params.get('card') ? `<i class="rail-span" style="left:${ratio('2026-09-21')}%;width:${ratio('2026-10-16') - ratio('2026-09-21')}%"></i>` : ''}`;
}

function geometry(ws, withList) {
  const listW = withList ? (innerWidth <= 767 ? 104 : 280) : 0;
  const chartW = ws.clientWidth - listW - (withList ? 1 : 0);
  const dw = chartW / days;
  // 浮かぶ道具(下の操作盤と、出ていれば変化の帯)の高さぶん、行を上に収める
  const present = document.body.classList.contains('is-present');
  const reserve = present ? 0 : parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock-reserve')) + (showDiff ? 46 : 0);
  ws.style.setProperty('--dock-reserve', `${reserve}px`);
  const avail = ws.clientHeight - 44 - reserve;
  const floor = innerWidth <= 767 ? 44 : 14;
  const row = clamp(Math.floor(avail / tasks.length), floor, 36);
  return { dw, row, chartW };
}

function barHTML(t, g) {
  const x = (iso) => diff(range.start, iso) * g.dw;
  const nowX = x(TODAY) + g.dw / 2;
  const st = stateOf(t);
  const barH = Math.max(16, Math.min(g.row - 4, Math.round(g.row * 0.72)));
  let html = '';
  if (showDiff && t.was) {
    const gl = x(t.was[0]);
    const gw = (diff(t.was[0], t.was[1]) + 1) * g.dw;
    html += `<i class="afterimage" style="left:${gl}px;width:${gw}px"></i>`;
  }
  if (t.milestone) {
    const cx = x(t.start) + g.dw / 2;
    const late = !t.done && t.start < TODAY;
    html += `<i class="milestone ${t.done ? 'is-done' : ''} ${t.deadline ? 'is-deadline' : ''} ${late ? 'is-late' : ''}" style="left:${cx}px"></i>`;
    html += `<span class="name-out" style="left:${cx + 13}px"><span>${esc(t.name)}</span><span class="dates num">${md(t.start)}${t.deadline ? ' · 締切' : ''}</span></span>`;
    return html;
  }
  const left = x(t.start);
  const width = Math.max(6, (diff(t.start, t.end) + 1) * g.dw);
  const elapsed = st === 'late' ? 100 : st === 'active' ? clamp((nowX - left) / width * 100, 0, 100) : 0;
  const dates = `${md(t.start)}–${md(t.end)}`;
  const inside = textW(t.name) + textW(dates, 11) + 30 <= width;
  const nameOnly = textW(t.name) + 22 <= width;
  const label = inside ? `<span>${esc(t.name)}</span><span class="dates num">${dates}</span>` : nameOnly ? `<span>${esc(t.name)}</span>` : '';
  html += `<button type="button" class="task-bar ${st === 'done' ? 'is-done' : ''} ${t.isNew && showDiff ? 'is-new' : ''} ${t.selected ? 'is-selected' : ''}" style="left:${left}px;width:${width}px;height:${barH}px;--elapsed:${elapsed.toFixed(1)}%" data-name="${esc(t.name)}">${label}</button>`;
  let after = left + width + 8;
  if (st === 'late') {
    // 遅れ: バーの終わりから今日まで朱の糸を引き、日数は今日の右に置く
    const x1 = left + width;
    html += `<i class="late-thread" style="left:${x1}px;width:${Math.max(4, nowX - x1)}px"></i>`;
    html += `<span class="late-label num" style="left:${nowX + 9}px">${diff(t.end, TODAY)}日遅れ</span>`;
    after = nowX + 9 + textW(`${diff(t.end, TODAY)}日遅れ`, 11) + 8;
  }
  if (!inside) {
    const outW = (nameOnly ? 0 : textW(t.name) + 7) + textW(dates, 11);
    // 右端で切れるなら、バーの左に出す
    const pos = after + outW > g.chartW - 8 ? `left:${left - outW - 10}px` : `left:${after}px`;
    html += `<span class="name-out" style="${pos}">${nameOnly ? '' : `<span>${esc(t.name)}</span>`}<span class="dates num">${dates}</span></span>`;
    if (after + outW <= g.chartW - 8) after += outW + 10;
  }
  // 付箋(+4日・新規)も右端で切れるならバーの左へ回す
  const tagAt = (w) => (after + w > g.chartW - 4 ? Math.max(2, left - w - 6) : after);
  if (showDiff && t.was) {
    const d = diff(t.was[1], t.end) || diff(t.was[0], t.start);
    html += `<span class="delta-chip num" style="left:${tagAt(40)}px">${d > 0 ? '+' : ''}${d}日</span>`;
  }
  if (showDiff && t.isNew) html += `<span class="new-badge" style="left:${tagAt(34)}px">新規</span>`;
  return html;
}

function timelineHTML(g) {
  const x = (iso) => diff(range.start, iso) * g.dw;
  const nowX = x(TODAY) + g.dw / 2;
  const heads = [];
  const rules = [];
  for (let i = 0; i < days; i += 1) {
    const iso = add(range.start, i);
    const d = toDate(iso);
    if (d.getUTCDate() === 1) {
      heads.push(`<span class="month-label" style="left:${i * g.dw}px">${d.getUTCMonth() + 1}月${d.getUTCMonth() === 8 ? '<small>2026</small>' : ''}</span><i class="month-tick" style="left:${i * g.dw}px"></i>`);
      rules.push(`<i class="month-rule" style="left:${i * g.dw}px"></i>`);
    }
    const monday = d.getUTCDay() === 1;
    if ((g.dw >= 18 || (g.dw >= 7 && monday)) && iso !== TODAY) heads.push(`<span class="day-tick num" style="left:${(i + 0.5) * g.dw}px">${d.getUTCDate()}</span>`);
  }
  const c = counts();
  const t = toDate(TODAY);
  const mobile = innerWidth <= 767;
  heads.push(`<span class="day-tick num is-today" style="left:${nowX}px">${t.getUTCDate()}</span>`);
  // いまの旗: 日付と、遅れがあればその件数(押すと遅れだけに絞る)。旗と重なる月の見出しは旗の右へずらす
  const flagText = mobile ? md(TODAY) : `今日 ${md(TODAY)} ${WD[t.getUTCDay()]}`;
  const showLate = c.late && !mobile;
  const flagW = textW(flagText, 11) + 18 + (showLate ? textW(`遅れ ${c.late}`, 11) + 16 : 0);
  const flagL = nowX - flagW / 2;
  heads.push(`<span class="now-flag" style="left:${nowX}px"><span class="pill num">${flagText}</span>${showLate ? `<button type="button" class="late num" title="遅れている予定だけを表示">遅れ ${c.late}</button>` : ''}</span>`);
  for (let i = 0; i < heads.length; i += 1) {
    const m = heads[i].match(/^<span class="month-label" style="left:([\d.]+)px">/);
    if (!m) continue;
    const mx = Number(m[1]);
    if (mx + 60 <= flagL || mx >= flagL + flagW) continue;
    // 旗と重なる月の見出しは、旗の右へずらす。ずらす余地が無ければ消す(月の罫は残る)
    const next = heads.slice(i + 1).map((h) => h.match(/^<span class="month-label" style="left:([\d.]+)px">/)).find(Boolean);
    heads[i] = next && flagL + flagW + 64 > Number(next[1]) ? heads[i].replace(/^<span class="month-label".*?<\/span>/, '') : heads[i].replace(`left:${m[1]}px`, `left:${flagL + flagW + 4}px`);
  }
  tasks.filter((t) => t.deadline).forEach((t) => {
    const dx = x(t.start) + g.dw / 2;
    heads.push(`<span class="deadline-flag num" style="left:${dx}px">締切 <span>${esc(t.name)} · あと${diff(TODAY, t.start)}日</span></span>`);
    rules.push(`<i class="deadline-pillar" style="left:${dx}px"></i>`);
  });
  const firstSat = (6 - toDate(range.start).getUTCDay() + 7) % 7;
  return `<div class="timeline-inner" style="width:${g.chartW}px;--dw:${g.dw}px;--we-offset:${firstSat * g.dw}px">
    <div class="timeline-head">${heads.join('')}</div>
    <div class="timeline-body"><div class="grid-bands"></div>${rules.join('')}<div class="past-wash" style="width:${nowX}px"></div><i class="now-blade" style="left:${nowX}px"></i>
    ${tasks.map((t) => `<div class="timeline-row ${cls(t)} ${t.selected ? 'is-selected' : ''} ${stateOf(t) === 'done' ? 'is-done-row' : ''}">${barHTML(t, g)}</div>`).join('')}</div>
  </div>`;
}

function indexHTML() {
  return `<section class="task-panel"><div class="task-head">予定 <b class="num">${tasks.length}</b></div><div class="task-scroll"><div class="task-rows">${tasks.map((t) => {
    const st = stateOf(t);
    const state = st === 'late' ? `<span class="row-state late num">${diff(t.end, TODAY)}日遅れ</span>` : st === 'active' ? '<span class="row-state active"></span>' : '<span></span>';
    return `<div class="task-row ${cls(t)} ${st === 'done' ? 'is-done' : ''} ${t.selected ? 'is-selected' : ''}"><span class="check"></span><span class="row-name">${esc(t.name)}</span>${state}<button class="row-more" type="button">•••</button></div>`;
  }).join('')}</div></div></section>`;
}

function spanHTML(t) {
  const r = (iso) => clamp(diff(projStart, iso) / projDays * 100, 0, 100);
  const a = r(t.start);
  const w = Math.max(1.2, r(add(t.end, 1)) - a);
  return `<span class="mini-span ${t.done ? 'is-done' : ''}"><i style="left:${a}%;width:${w}%"></i><b style="left:${r(TODAY)}%"></b></span>`;
}

const STATE_LABEL = { done: '完了', late: '遅れ', active: '進行中', upcoming: '予定' };
function listHTML() {
  if (innerWidth <= 767) {
    return `<section class="list-table"><div class="task-rows">${tasks.map((t) => {
      const st = stateOf(t);
      const period = t.milestone ? md(t.start) : `${md(t.start)}–${md(t.end)} · ${diff(t.start, t.end) + 1}日`;
      return `<div class="ticket ${cls(t)} ${st === 'done' ? 'is-done' : ''}"><span class="check"></span><span class="t-name">${esc(t.name)}</span><span class="state-pill ${st} num">${st === 'late' ? `${diff(t.end, TODAY)}日遅れ` : STATE_LABEL[st]}</span><span class="t-meta num">${esc(t.cat)} · ${period}</span>${spanHTML(t)}</div>`;
    }).join('')}</div></section>`;
  }
  return `<section class="list-table"><div class="list-head"><span></span><span>予定</span><span>カテゴリー</span><span>期間</span><span>開始</span><span>終了</span><span>日数</span><span>状態</span><span></span></div><div class="task-rows">${tasks.map((t) => {
    const st = stateOf(t);
    return `<div class="list-row ${cls(t)} ${st === 'done' ? 'is-done' : ''}"><span class="check"></span><span class="row-name">${esc(t.name)}</span><span class="cat-chip"><i></i>${esc(t.cat)}</span>${spanHTML(t)}<span class="num">${md(t.start)}</span><span class="num">${t.milestone ? '—' : md(t.end)}</span><span class="num" style="color:var(--muted)">${t.milestone ? '◆' : `${diff(t.start, t.end) + 1}日`}</span><span class="state-pill ${st} num">${st === 'late' ? `${diff(t.end, TODAY)}日遅れ` : STATE_LABEL[st]}</span><span class="row-more" style="opacity:1">•••</span></div>`;
  }).join('')}</div></section>`;
}

function render() {
  const mobile = innerWidth <= 767;
  let mode = params.get('mode') || (mobile ? 'list' : 'split');
  const ws = document.querySelector('#workspace');
  ws.className = `workspace mode-${mode}`;
  document.querySelectorAll('#mode-switch button').forEach((b) => b.classList.toggle('is-active', b.dataset.mode === mode));
  document.querySelector('#mobile-toggle').textContent = mode === 'gantt' ? '一覧' : 'ガント';
  if (mode === 'list') { ws.innerHTML = listHTML(); return; }
  const g = geometry(ws, mode === 'split' || mobile);
  ws.style.setProperty('--row-height', `${g.row}px`);
  ws.style.setProperty('--bar-h', `${Math.max(16, Math.min(g.row - 4, Math.round(g.row * 0.72)))}px`);
  document.querySelector('#row-out').textContent = g.row;
  ws.innerHTML = `${mode === 'split' || mobile ? indexHTML() : ''}<section class="timeline-panel"><div class="timeline-scroll">${timelineHTML(g)}</div></section>`;
}

function tray() {
  const bar = document.querySelector('#condition-bar');
  if (!showDiff) { bar.innerHTML = ''; return; }
  bar.innerHTML = `<span class="diff-chip num"><b>取り込みの変更</b><span class="n">移動 <strong>3</strong> · 追加 <strong>1</strong> · 削除 <strong>1</strong></span><button type="button">変更だけ表示</button><button type="button" class="x" aria-label="変更の表示を消す">✕</button></span>`;
}

if (params.get('card')) tasks.find((t) => t.name === 'EC連携の実装').selected = true;
if (params.get('present')) document.body.classList.add('is-present');
header();
render();
tray();
if (params.get('palette')) document.querySelector('#palette').classList.add('is-open');
if (params.get('card')) {
  const bar = document.querySelector('[data-name="EC連携の実装"]');
  const r = bar.getBoundingClientRect();
  const card = document.querySelector('#card');
  card.classList.add('is-open');
  card.style.left = `${r.left}px`;
  card.style.top = `${r.bottom + 8}px`;
}
addEventListener('resize', render);
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.querySelector('#palette').classList.toggle('is-open'); }
  if (e.key === 'Escape') { document.querySelector('#palette').classList.remove('is-open'); document.querySelector('#card').classList.remove('is-open'); document.body.classList.remove('is-present'); }
});
['#search-open', '#search-open-m'].forEach((s) => document.querySelector(s).addEventListener('click', (e) => { e.preventDefault(); document.querySelector('#palette').classList.add('is-open'); }));
document.querySelector('#palette').addEventListener('click', (e) => { if (e.target.id === 'palette') e.currentTarget.classList.remove('is-open'); });
document.querySelector('#present-btn').addEventListener('click', () => { document.body.classList.add('is-present'); render(); });
document.querySelector('#exit-present').addEventListener('click', () => { document.body.classList.remove('is-present'); render(); });
document.querySelectorAll('#mode-switch button').forEach((b) => b.addEventListener('click', () => { params.set('mode', b.dataset.mode); history.replaceState(null, '', `?${params}`); render(); }));
</script>
</body>
</html>
