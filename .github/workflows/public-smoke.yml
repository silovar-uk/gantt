name: Public UX smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check UX JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v5/classic/11-ux-workspace.js
          node --check src/v5/classic/12-overflow-history.js
          node --check src/v5/classic/13-overview-density.js
          node --check src/v5/classic/15-macro-overview.js
          node --check src/v5/classic/16-macro-detail-lens.js
          node --check src/v5/classic/17-project-surface.js
          node --check src/v5/classic/18-time-compass.js
          node --check src/v5/classic/19-ui-polish.js
          node --check src/v5/classic/20-quiet-coach.js
          node --check src/v5/classic/21-task-card.js
          node --check src/v5/classic/22-command-palette.js
          node --check src/v5/classic/23-afterimage.js
          test ! -e src/v5/classic/14-tighter-rows.js
          test ! -e assets/v8-tighter-rows.css
          node --check scripts/validate-css-architecture.mjs
          node --check scripts/public-e2e-ux-run.mjs
          node --check scripts/public-e2e-tight-rows.mjs
          node --check scripts/public-e2e-macro-overview.mjs
          node --check scripts/public-e2e-project-surface.mjs
          node --check scripts/public-e2e-ui-polish.mjs
          node --check scripts/public-e2e-one-overview.mjs
          node --check scripts/public-e2e-project-rhythm.mjs
          node --check scripts/public-e2e-visible-truth.mjs
          node --check scripts/public-e2e-task-card.mjs
          node --check scripts/public-e2e-now-desk.mjs
          node scripts/validate-css-architecture.mjs
      - name: Wait for matching public deployment
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 50); do
            curl -fsSL --retry 3 --retry-delay 1 https://silovar-uk.github.io/gantt/ -o /tmp/live-index.html || true
            if grep -q 'assets/v6-workspace-ux.css?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'assets/v7-overview-density.css?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'assets/v9-macro-overview.css?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'assets/v11-project-surface.css?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'assets/v12-time-compass.css?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'assets/v13-sage-polish.css?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && ! grep -q 'assets/v8-tighter-rows.css' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/13-overview-density.js?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/15-macro-overview.js?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/17-project-surface.js?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/18-time-compass.js?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/19-ui-polish.js?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'assets/v14-task-card.css?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/21-task-card.js?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'assets/v15-now-desk.css?v=20260921-label1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/22-command-palette.js?v=20260921-desk1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/23-afterimage.js?v=20260921-desk1' /tmp/live-index.html 2>/dev/null; then
              matched=1
              break
            fi
            sleep 3
          done
          if [ "$matched" -ne 1 ]; then
            echo 'Matching Rhythm Context Echo deployment did not become public in time' >&2
            exit 1
          fi
          curl -fsSL 'https://silovar-uk.github.io/gantt/assets/v6-workspace-ux.css?v=20260921-desk1' -o /tmp/v6-workspace.css
          curl -fsSL 'https://silovar-uk.github.io/gantt/assets/v7-overview-density.css?v=20260921-desk1' -o /tmp/v7-density.css
          curl -fsSL 'https://silovar-uk.github.io/gantt/assets/v9-macro-overview.css?v=20260921-desk1' -o /tmp/v9-macro.css
          curl -fsSL 'https://silovar-uk.github.io/gantt/assets/v11-project-surface.css?v=20260921-desk1' -o /tmp/v11-surface.css
          curl -fsSL 'https://silovar-uk.github.io/gantt/assets/v12-time-compass.css?v=20260921-desk1' -o /tmp/v12-compass.css
          curl -fsSL 'https://silovar-uk.github.io/gantt/assets/v13-sage-polish.css?v=20260921-desk1' -o /tmp/v13-sage.css
          curl -fsSL 'https://silovar-uk.github.io/gantt/assets/v14-task-card.css?v=20260921-desk1' -o /tmp/v14-card.css
          curl -fsSL 'https://silovar-uk.github.io/gantt/assets/v15-now-desk.css?v=20260921-label1' -o /tmp/v15-desk.css
          curl -fsSL 'https://silovar-uk.github.io/gantt/src/v5/classic/13-overview-density.js?v=20260921-desk1' -o /tmp/v13-overview.js
          curl -fsSL 'https://silovar-uk.github.io/gantt/src/v5/classic/15-macro-overview.js?v=20260921-desk1' -o /tmp/v15-macro.js
          curl -fsSL 'https://silovar-uk.github.io/gantt/src/v5/classic/18-time-compass.js?v=20260921-desk1' -o /tmp/v18-compass.js
          grep -q 'workspace.is-rhythm-echo' /tmp/v6-workspace.css
          grep -q 'overview-density owner' /tmp/v7-density.css
          grep -q 'semantic macro overview' /tmp/v9-macro.css
          grep -q 'mode-macro.is-rhythm-echo' /tmp/v9-macro.css
          grep -q 'project surface layout' /tmp/v11-surface.css
          grep -q 'Time Compass visual owner' /tmp/v12-compass.css
          grep -q 'time-compass-rhythm-window' /tmp/v12-compass.css
          grep -q 'Present is a HUD' /tmp/v13-sage.css
          grep -q 'task card owner' /tmp/v14-card.css
          grep -q 'now desk owner' /tmp/v15-desk.css
          grep -q "OVERVIEW_MODEL_VERSION = '20260918-overview2'" /tmp/v13-overview.js
          grep -q "MACRO_VERSION = '20260918-macro4'" /tmp/v15-macro.js
          grep -q '<strong>全体</strong>' /tmp/v15-macro.js
          grep -q "RHYTHM_VERSION = '20260914-rhythm3'" /tmp/v18-compass.js
          grep -q "COMPASS_VERSION = '20260918-window1'" /tmp/v18-compass.js
          grep -q "ECHO_VERSION = '20260914-echo1'" /tmp/v18-compass.js
          grep -q 'deriveRhythmLandmarks' /tmp/v18-compass.js
          grep -q 'exactPeakForRange' /tmp/v18-compass.js
          grep -q 'deriveRhythmContext' /tmp/v18-compass.js
          grep -q 'applyRhythmContext' /tmp/v18-compass.js
          if grep -q -E 'previousFitAll|semanticFitAll|needsMacroOverview' /tmp/v15-macro.js; then
            echo 'Macro renderer regained Overview decision logic' >&2
            exit 1
          fi
          if grep -q -E 'macro-density-strip|ux-macro-indicator|project-ribbon-activity|project-ribbon-milestones' /tmp/v7-density.css /tmp/v9-macro.css /tmp/v11-surface.css /tmp/v12-compass.css /tmp/v13-sage.css; then
            echo 'Dead CSS selector returned in public assets' >&2
            exit 1
          fi
      - name: Render desktop public app
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=1440,900 --virtual-time-budget=5000 --user-data-dir=/tmp/chrome-desktop --dump-dom https://silovar-uk.github.io/gantt/ > /tmp/desktop.html
          grep -q 'data-action="add"' /tmp/desktop.html
          grep -q 'AI用JSON' /tmp/desktop.html
          grep -q 'プレゼンテーション' /tmp/desktop.html
          grep -q 'id="ux-density-controls"' /tmp/desktop.html
          grep -q 'id="macro-detail-lens"' /tmp/desktop.html
          if grep -q 'boot-state' /tmp/desktop.html; then
            echo 'App did not finish booting on desktop' >&2
            exit 1
          fi
      - name: Render mobile public app
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5000 --user-data-dir=/tmp/chrome-mobile --dump-dom https://silovar-uk.github.io/gantt/ > /tmp/mobile.html
          grep -q 'data-action="add"' /tmp/mobile.html
          grep -q '予定を追加' /tmp/mobile.html
          if grep -q 'boot-state' /tmp/mobile.html; then
            echo 'App did not finish booting on mobile' >&2
            exit 1
          fi
      - name: Run published UX interaction suites
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core
          node scripts/public-e2e-ux-run.mjs
          node scripts/public-e2e-tight-rows.mjs
          node scripts/public-e2e-macro-overview.mjs
          node scripts/public-e2e-project-surface.mjs
          node scripts/public-e2e-ui-polish.mjs
          node scripts/public-e2e-one-overview.mjs
          node scripts/public-e2e-project-rhythm.mjs
          node scripts/public-e2e-visible-truth.mjs
          node scripts/public-e2e-task-card.mjs
          node scripts/public-e2e-now-desk.mjs
