name: Public UX smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check UX JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check src/v5/classic/11-ux-workspace.js
          node --check src/v5/classic/12-overflow-history.js
          node --check src/v5/classic/13-overview-density.js
          node --check src/v5/classic/14-tighter-rows.js
          node --check src/v5/classic/15-macro-overview.js
          node --check src/v5/classic/16-macro-detail-lens.js
          node --check scripts/public-e2e-ux-run.mjs
          node --check scripts/public-e2e-tight-rows.mjs
          node --check scripts/public-e2e-macro-overview.mjs
      - name: Wait for matching public deployment
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 50); do
            curl -fsSL --retry 3 --retry-delay 1 https://silovar-uk.github.io/gantt/ -o /tmp/live-index.html || true
            if grep -q 'assets/v8-tighter-rows.css?v=20260913-tight1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'assets/v9-macro-overview.css?v=20260914-macro2' /tmp/live-index.html 2>/dev/null \
              && grep -q 'assets/v10-macro-detail-lens.css?v=20260914-lens1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/15-macro-overview.js?v=20260914-macro1' /tmp/live-index.html 2>/dev/null \
              && grep -q 'src/v5/classic/16-macro-detail-lens.js?v=20260914-lens1' /tmp/live-index.html 2>/dev/null; then
              matched=1
              break
            fi
            sleep 3
          done
          if [ "$matched" -ne 1 ]; then
            echo 'Matching macro detail-lens deployment did not become public in time' >&2
            exit 1
          fi
          curl -fsSL 'https://silovar-uk.github.io/gantt/assets/v10-macro-detail-lens.css?v=20260914-lens1' -o /tmp/v10-macro-detail-lens.css
          curl -fsSL 'https://silovar-uk.github.io/gantt/src/v5/classic/16-macro-detail-lens.js?v=20260914-lens1' -o /tmp/v5-16.js
          grep -q 'macro detail lens' /tmp/v10-macro-detail-lens.css
          grep -q 'LENS_VERSION' /tmp/v5-16.js
          grep -q 'FOCUS · TASK' /tmp/v5-16.js
      - name: Render desktop public app
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=1440,900 --virtual-time-budget=5000 --user-data-dir=/tmp/chrome-desktop --dump-dom https://silovar-uk.github.io/gantt/ > /tmp/desktop.html
          grep -q 'data-action="add"' /tmp/desktop.html
          grep -q 'AI用JSON' /tmp/desktop.html
          grep -q 'Present' /tmp/desktop.html
          grep -q 'id="ux-density-controls"' /tmp/desktop.html
          grep -q 'id="macro-detail-lens"' /tmp/desktop.html
          if grep -q 'boot-state' /tmp/desktop.html; then
            echo 'App did not finish booting on desktop' >&2
            exit 1
          fi
      - name: Render mobile public app
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=5000 --user-data-dir=/tmp/chrome-mobile --dump-dom https://silovar-uk.github.io/gantt/ > /tmp/mobile.html
          grep -q 'data-action="add"' /tmp/mobile.html
          grep -q '予定を追加' /tmp/mobile.html
          grep -q 'id="ux-density-controls"' /tmp/mobile.html
          grep -q 'id="macro-detail-lens"' /tmp/mobile.html
          if grep -q 'boot-state' /tmp/mobile.html; then
            echo 'App did not finish booting on mobile' >&2
            exit 1
          fi
      - name: Run published UX interaction suites
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core
          node scripts/public-e2e-ux-run.mjs
          node scripts/public-e2e-tight-rows.mjs
          node scripts/public-e2e-macro-overview.mjs
