name: Validate v5

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/v5/classic/*.js; do
            node --check "$file"
          done
          node --check scripts/validate-css-architecture.mjs
          node --check scripts/public-e2e-one-overview.mjs
          node --check scripts/public-e2e-project-rhythm.mjs
          node --check scripts/public-e2e-now-desk.mjs
      - name: Verify production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/v5-base.css' index.html
          grep -q 'assets/v5-responsive.css' index.html
          grep -q 'assets/v6-workspace-ux.css?v=20260921-desk1' index.html
          grep -q 'assets/v9-macro-overview.css?v=20260921-desk1' index.html
          grep -q 'src/v5/classic/01.js' index.html
          grep -q 'src/v5/classic/10.js' index.html
          grep -q 'src/v5/classic/13-overview-density.js?v=20260921-desk1' index.html
          grep -q 'src/v5/classic/15-macro-overview.js?v=20260921-desk1' index.html
          grep -q 'src/v5/classic/18-time-compass.js?v=20260921-desk1' index.html
          grep -q 'assets/v12-time-compass.css?v=20260921-desk1' index.html
          grep -q 'assets/v14-task-card.css' index.html
          grep -q 'src/v5/classic/21-task-card.js' index.html
          grep -q 'assets/v15-now-desk.css' index.html
          grep -q 'src/v5/classic/22-command-palette.js' index.html
          grep -q 'src/v5/classic/23-afterimage.js' index.html
          if grep -q 'assets/v8-tighter-rows.css' index.html; then
            echo 'Obsolete tighter-row CSS is still loaded' >&2
            exit 1
          fi
          if grep -q 'src/main.js' index.html; then
            echo 'Legacy main runtime is still loaded' >&2
            exit 1
          fi
          if grep -q 'share-layer.js' index.html; then
            echo 'Legacy share layer is still loaded' >&2
            exit 1
          fi
      - name: Verify One Overview ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -q "OVERVIEW_MODEL_VERSION = '20260918-overview2'" src/v5/classic/13-overview-density.js
          grep -q "overviewMacroMode: representation === 'shape'" src/v5/classic/13-overview-density.js
          grep -q 'resolveOverviewRepresentation' src/v5/classic/13-overview-density.js
          if grep -q -E 'previousFitAll|semanticFitAll|needsMacroOverview' src/v5/classic/15-macro-overview.js; then
            echo 'Macro renderer is deciding Overview representation again' >&2
            exit 1
          fi
          grep -q '<strong>全体</strong>' src/v5/classic/15-macro-overview.js
      - name: Verify Project Rhythm and Context Echo ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -q "RHYTHM_VERSION = '20260914-rhythm3'" src/v5/classic/18-time-compass.js
          grep -q "COMPASS_VERSION = '20260918-window1'" src/v5/classic/18-time-compass.js
          grep -q "ECHO_VERSION = '20260914-echo1'" src/v5/classic/18-time-compass.js
          grep -q 'deriveRhythmLandmarks' src/v5/classic/18-time-compass.js
          grep -q 'exactPeakForRange' src/v5/classic/18-time-compass.js
          grep -q 'deriveRhythmContext' src/v5/classic/18-time-compass.js
          grep -q 'applyRhythmContext' src/v5/classic/18-time-compass.js
          grep -q 'clearRhythmContext' src/v5/classic/18-time-compass.js
          grep -q 'focusRhythmRange' src/v5/classic/18-time-compass.js
          grep -q 'time-compass-rhythm-window' assets/v12-time-compass.css
          grep -q 'workspace.is-rhythm-echo' assets/v6-workspace-ux.css
          grep -q 'mode-macro.is-rhythm-echo' assets/v9-macro-overview.css
          if grep -R -n 'time-compass-rhythm-window' src/v5/classic --exclude='18-time-compass.js'; then
            echo 'Project Rhythm DOM escaped the Time Compass owner' >&2
            exit 1
          fi
          if grep -R -n 'is-rhythm-echo' src/v5/classic --exclude='18-time-compass.js'; then
            echo 'Context Echo runtime escaped the Time Compass owner' >&2
            exit 1
          fi
          unexpected_echo_css=$(grep -R -l 'is-rhythm-echo' assets --include='*.css' | grep -v -E 'assets/v6-workspace-ux.css|assets/v9-macro-overview.css' || true)
          if [ -n "$unexpected_echo_css" ]; then
            echo "Context Echo CSS escaped Workspace/Macro owners: $unexpected_echo_css" >&2
            exit 1
          fi
      - name: Verify CSS architecture
        run: node scripts/validate-css-architecture.mjs
      - name: Verify no in-app AI API
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'api\.openai\.com|openai\.com/v1|Authorization:[[:space:]]*Bearer|api[_-]?key' src/v5 index.html; then
            echo 'Unexpected AI API implementation found' >&2
            exit 1
          fi
          grep -R -q 'https://chatgpt.com/?prompt=' src/v5/classic
      - name: Run data-contract tests
        run: node scripts/validate-v5.mjs
      - name: Verify generated XLSX archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -t /tmp/gantt-v5-test.xlsx
          unzip -p /tmp/gantt-v5-test.xlsx xl/worksheets/sheet1.xml > /tmp/gantt-v5-sheet1.xml
          grep -q '日本語の予定' /tmp/gantt-v5-sheet1.xml
          grep -q '&apos;=SUM(A1:A2)' /tmp/gantt-v5-sheet1.xml
